services:
  postgres:
    image: postgres:16
    container_name: event-sourcing-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/sql/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql:ro

volumes:
  postgres_data:
